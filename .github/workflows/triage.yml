# Automatické triedenie issues (CONTRIBUTING.md):
#   - odpovede z formulára (Category, Priority, Size) → štítky kategórie / priority / veľkosti
#     (len ak issue zo skupiny ešte nemá žiadny štítok, aby sa neprepísalo rozhodnutie maintainera)
#   - druh (bug / feature / discussion) z nadpisov šablóny, keď issue ešte nemá žiadny druh
#     (issue z CLI od prispievateľa bez práv na štítky): prvý nadpis „### …“ určí šablónu
#     a v tele musia byť všetky jej povinné nadpisy (pri opened / edited / reopened)
#   - issue musí mať práve jeden druh (bug / feature / discussion) a aspoň jednu kategóriu,
#     inak dostane štítok „triage“
# Beží na GitHub runneri, bez checkoutu; telo issue ide cez env, nikdy nie priamo do shellu.
name: Triedenie issues

on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened]

permissions:
  issues: write

concurrency:
  group: triage-${{ github.event.issue.number }}

jobs:
  triage:
    name: Štítky issue
    if: github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.issue.number }}
      ACTION: ${{ github.event.action }}
      BODY: ${{ github.event.issue.body }}
    steps:
      - name: Štítky z formulára a kontrola druhu a kategórie
        run: |
          set -euo pipefail
          KINDS='bug|feature|discussion'
          CATEGORIES='gameplay|logic|ui|graphics|infra|docs'
          PRIORITIES='critical|high|medium|low'
          SIZES='XS|S|M|L|XL'
          # aktuálne štítky (nie snímka z udalosti – štítky sa medzitým mohli zmeniť)
          LABELS="$(gh issue view "$NUMBER" --json labels -q '.labels[].name')"
          count() { grep -cxE "$1" <<<"$LABELS" || true; }
          # odpoveď pod „### <nadpis>“ z formulára; viac volieb je oddelených „, “ → prvé slovo každej
          answer() {
            awk -v h="### $1" '$0==h{f=1;next} f&&/^### /{exit} f&&NF{print;exit}' <<<"$BODY" | tr -d '\r' \
              | sed 's/, /\n/g' | awk '{print $1}' | grep -xE "$2" || true
          }
          add=()
          [ "$(count "$CATEGORIES")" -gt 0 ] || while read -r c; do [ -n "$c" ] && add+=("$c"); done <<<"$(answer Category "$CATEGORIES")"
          [ "$(count "$PRIORITIES")" -gt 0 ] || { p="$(answer Priority "$PRIORITIES" | head -1)"; [ -n "$p" ] && add+=("$p"); }
          [ "$(count "$SIZES")" -gt 0 ] || { s="$(answer Size "$SIZES" | head -1)"; [ -n "$s" ] && add+=("$s"); }

          # druh z nadpisov šablóny (.github/ISSUE_TEMPLATE/*.yml): prvý nadpis + povinné nadpisy
          kind_from_headings() {
            local headings first
            headings="$(tr -d '\r' <<<"$BODY" | sed -n 's/^### //p')"
            first="$(head -1 <<<"$headings")"
            has_all() { local h; for h in "$@"; do grep -qxF "$h" <<<"$headings" || return 1; done; }
            case "$first" in
              'What happened') has_all 'Steps to reproduce' 'Expected behaviour' Where Category Priority && echo bug ;;
              'Problem / motivation') has_all 'Proposed solution' 'Acceptance criteria' Category Size Priority && echo feature ;;
              Topic) has_all Category 'Questions to decide' && echo discussion ;;
            esac
            return 0
          }
          kinds="$(count "$KINDS")"
          # nie pri (od)označení: maintainer práve mení druh (odobral starý, pridá nový)
          if [ "$kinds" -eq 0 ] && [ "$ACTION" != labeled ] && [ "$ACTION" != unlabeled ]; then
            k="$(kind_from_headings)"
            if [ -n "$k" ]; then
              add+=("$k")
              kinds=1
              gh issue comment "$NUMBER" --body "Kind inferred from the template headings: \`$k\`."
            fi
          fi
          categories=$(( $(count "$CATEGORIES") + $(printf '%s\n' "${add[@]}" | grep -cxE "$CATEGORIES" || true) ))
          if [ "$kinds" -eq 1 ] && [ "$categories" -gt 0 ]; then
            if grep -qx triage <<<"$LABELS"; then gh issue edit "$NUMBER" --remove-label triage; fi
          elif ! grep -qx triage <<<"$LABELS"; then
            add+=(triage)
            if [ "$ACTION" = opened ]; then
              gh issue comment "$NUMBER" --body "This issue needs exactly one kind label (\`bug\`, \`feature\` or \`discussion\`; it has $kinds) and at least one category label (\`gameplay\`, \`logic\`, \`ui\`, \`graphics\`, \`infra\`, \`docs\`; it has $categories). Please use one of the [issue forms](https://github.com/$GH_REPO/issues/new/choose) or follow [CONTRIBUTING.md](https://github.com/$GH_REPO/blob/dev/CONTRIBUTING.md#reporting-issues)."
            fi
          fi

          for l in "${add[@]}"; do
            echo "pridávam štítok: $l"
            gh issue edit "$NUMBER" --add-label "$l"
          done
