# CI/CD: testy → obraz do GHCR → nasadenie na hostiteľa (self-hosted runner s labelom "magicflowers").
#   PR (z vetvy tohto repozitára) → https://pr-<n>.zahrada.spis-ai.com, pri zatvorení PR sa zmaže
#   push do dev                    → https://dev.zahrada.spis-ai.com (staging)
#   tag v* na main (release)       → https://zahrada.spis-ai.com (produkcia)
# PR z forkov sa len otestujú – na hostiteľovi sa z nich nič nespúšťa.
# Ak GitHub udalosť nedoručí (výpadok), dev sa dá znova nasadiť cez „Run workflow“ na vetve dev
# a staré PR náhľady upratuje job „Upratanie PR náhľadov“ (po každom nasadení dev, denne, ručne).
# Na stránke Deployments ostáva aktívny len aktuálny deployment – staršie a zatvorené PR dostanú
# stav „inactive“ (scripts/deployments.sh), história sa nemaže.
name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'   # denné upratanie PR náhľadov (beží s workflow z main)

permissions:
  contents: read

# Skupina podľa udalosti a PR: zatvorený PR má github.ref = základná vetva (dev), takže
# so spoločnou skupinou by beh „closed“ zrušil nasadenie dev z push (alebo naopak).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # PR z vetvy v tomto repozitári (nie z forku)
  SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  test:
    name: Testy
    if: github.event.action != 'closed' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Kontrola syntaxe
        run: for f in server.js engine.js economy.js items.js shared/*.js public/*.js public/*.mjs; do node --check "$f"; done
      - name: Testy (node:test)
        run: npm test
      - name: Kontrola skriptov
        run: bash -n scripts/deploy.sh scripts/deployments.sh

  image:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Metadáta (tagy)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=pr
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build (lokálne pre smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: magic-flowers:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test kontajnera
        run: |
          docker run -d --name mf -p 3000:3000 magic-flowers:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ > /dev/null && curl -fsS http://localhost:3000/shared/data.js > /dev/null; then
              echo "Server odpovedá"; docker logs mf; exit 0
            fi
            sleep 1
          done
          echo "Server neodpovedá"; docker logs mf; exit 1

      - name: Prihlásenie do GHCR
        if: env.SAME_REPO == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push do GHCR
        if: env.SAME_REPO == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  deploy-preview:
    name: Nasadenie PR náhľadu
    needs: image
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, magicflowers]
    permissions:
      contents: read
      packages: read
      deployments: write
    environment:
      name: preview
      url: https://pr-${{ github.event.number }}.zahrada.spis-ai.com/
    concurrency:
      group: deploy-pr-${{ github.event.number }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/deploy.sh up pr-${{ github.event.number }} ${{ env.IMAGE }}:sha-${{ github.sha }}
        env:
          DEBUG_TOKEN: ${{ secrets.DEBUG_TOKEN }}
      - name: Deaktivovať staršie deploymenty náhľadu
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: scripts/deployments.sh supersede preview "$HEAD_REF"

  remove-preview:
    name: Zrušenie PR náhľadu
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, magicflowers]
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: deploy-pr-${{ github.event.number }}
    steps:
      - uses: actions/checkout@v7
      - run: scripts/deploy.sh down pr-${{ github.event.number }}
      - name: Deaktivovať deploymenty náhľadu
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: scripts/deployments.sh retire preview "$HEAD_REF"

  deploy-dev:
    name: Nasadenie dev (staging)
    needs: image
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/dev'
    runs-on: [self-hosted, magicflowers]
    permissions:
      contents: read
      packages: read
      deployments: write
    environment:
      name: dev
      url: https://dev.zahrada.spis-ai.com/
    concurrency:
      group: deploy-dev
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/deploy.sh up dev ${{ env.IMAGE }}:sha-${{ github.sha }}
        env:
          DEBUG_TOKEN: ${{ secrets.DEBUG_TOKEN }}
      - name: Deaktivovať staršie deploymenty dev
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/deployments.sh supersede dev

  prune-previews:
    name: Upratanie PR náhľadov
    needs: deploy-dev
    # Po nasadení dev (zlúčenie PR), denne a ručne – zmaže náhľady PR, ktoré už nie sú otvorené,
    # a deaktivuje ich GitHub deploymenty (aj staršie nasadenia dev a produkcie).
    if: >-
      always() && !cancelled() && github.repository == 'marekvasko/magic-flowers' &&
      (needs.deploy-dev.result == 'success' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, magicflowers]
    permissions:
      contents: read
      pull-requests: read
      deployments: write
    concurrency:
      group: prune-previews
    steps:
      - uses: actions/checkout@v7
      - name: Zmazať náhľady zatvorených PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 500 --json number --jq '.[].number')
          scripts/deploy.sh prune $open
      - name: Deaktivovať deploymenty zatvorených PR a staršie nasadenia
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          refs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 500 --json headRefName,isCrossRepository --jq '.[] | select(.isCrossRepository | not) | .headRefName')
          scripts/deployments.sh prune $refs

  deploy-prod:
    name: Nasadenie produkcie (release)
    needs: image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, magicflowers]
    permissions:
      contents: read
      packages: read
      deployments: write
    environment:
      name: production
      url: https://zahrada.spis-ai.com/
    concurrency:
      group: deploy-prod
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Release musí byť na main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag ${GITHUB_REF_NAME} nie je na main"; exit 1; }
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/deploy.sh up prod ${{ env.IMAGE }}:sha-${{ github.sha }}
        env:
          DEBUG_TOKEN: ${{ secrets.DEBUG_TOKEN }}
      - name: Deaktivovať staršie deploymenty produkcie
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/deployments.sh supersede production
