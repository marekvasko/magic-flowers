# CI/CD: testy → obraz do GHCR → nasadenie na hostiteľa (self-hosted runner s labelom "magicflowers").
#   PR (z vetvy tohto repozitára) → https://pr-<n>.zahrada.spis-ai.com, pri zatvorení PR sa zmaže
#   push do dev                    → https://dev.zahrada.spis-ai.com (staging)
#   tag v* na main (release)       → https://zahrada.spis-ai.com (produkcia)
# PR z forkov sa len otestujú – na hostiteľovi sa z nich nič nespúšťa.
name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # PR z vetvy v tomto repozitári (nie z forku)
  SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  test:
    name: Testy
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Kontrola syntaxe
        run: for f in server.js engine.js economy.js items.js shared/*.js public/*.js public/*.mjs; do node --check "$f"; done
      - name: Testy (node:test)
        run: npm test
      - name: Kontrola skriptov
        run: bash -n scripts/deploy.sh

  image:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Metadáta (tagy)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=pr
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build (lokálne pre smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: magic-flowers:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test kontajnera
        run: |
          docker run -d --name mf -p 3000:3000 magic-flowers:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ > /dev/null && curl -fsS http://localhost:3000/shared/data.js > /dev/null; then
              echo "Server odpovedá"; docker logs mf; exit 0
            fi
            sleep 1
          done
          echo "Server neodpovedá"; docker logs mf; exit 1

      - name: Prihlásenie do GHCR
        if: env.SAME_REPO == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push do GHCR
        if: env.SAME_REPO == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  deploy-preview:
    name: Nasadenie PR náhľadu
    needs: image
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, magicflowers]
    permissions:
      contents: read
      packages: read
    environment:
      name: preview
      url: https://pr-${{ github.event.number }}.zahrada.spis-ai.com/
    concurrency:
      group: deploy-pr-${{ github.event.number }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/deploy.sh up pr-${{ github.event.number }} ${{ env.IMAGE }}:sha-${{ github.sha }}

  remove-preview:
    name: Zrušenie PR náhľadu
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, magicflowers]
    concurrency:
      group: deploy-pr-${{ github.event.number }}
    steps:
      - uses: actions/checkout@v7
      - run: scripts/deploy.sh down pr-${{ github.event.number }}

  deploy-dev:
    name: Nasadenie dev (staging)
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: [self-hosted, magicflowers]
    permissions:
      contents: read
      packages: read
    environment:
      name: dev
      url: https://dev.zahrada.spis-ai.com/
    concurrency:
      group: deploy-dev
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/deploy.sh up dev ${{ env.IMAGE }}:sha-${{ github.sha }}

  deploy-prod:
    name: Nasadenie produkcie (release)
    needs: image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, magicflowers]
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://zahrada.spis-ai.com/
    concurrency:
      group: deploy-prod
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Release musí byť na main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag ${GITHUB_REF_NAME} nie je na main"; exit 1; }
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/deploy.sh up prod ${{ env.IMAGE }}:sha-${{ github.sha }}
