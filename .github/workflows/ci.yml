name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Kontrola syntaxe
        run: for f in server.js engine.js economy.js items.js shared/data.js public/*.js; do node --check "$f"; done
      - name: Testy (node:test)
        run: npm test

  image:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Metadáta (tagy)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=ref,event=pr

      - name: Build (lokálne pre smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: magic-flowers:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test kontajnera
        run: |
          docker run -d --name mf -p 3000:3000 magic-flowers:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ > /dev/null && curl -fsS http://localhost:3000/shared/data.js > /dev/null; then
              echo "Server odpovedá"; docker logs mf; exit 0
            fi
            sleep 1
          done
          echo "Server neodpovedá"; docker logs mf; exit 1

      - name: Prihlásenie do GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push do GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
