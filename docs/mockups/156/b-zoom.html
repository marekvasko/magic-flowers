<!doctype html><html><head><meta charset="utf-8"><style>
* { box-sizing: border-box; }
body { margin: 0; width: 390px; height: 780px; font-family: system-ui, "Segoe UI", Roboto, sans-serif; color: #2b2116; overflow: hidden; position: relative; background: #a9c9e8; }
.bg { position: absolute; inset: -40px; background: url(game.png) 50% 60% / 900px auto; filter: blur(3px) saturate(.9); }
svg { position: absolute; left: 0; top: 120px; }
.top { position: absolute; top: 14px; left: 12px; right: 12px; display: flex; gap: 8px; align-items: center; }
.back { padding: 10px 14px; border-radius: 14px; background: #fff8e7; border: 3px solid #8b5a2b; font-weight: 700; }
.title { flex: 1; padding: 10px 12px; border-radius: 14px; background: #fff8e7; border: 3px solid #8b5a2b; font-weight: 700; font-size: 15px; }
.tag { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); background: #fff8e7; border: 3px solid #8b5a2b; border-radius: 14px; padding: 6px 12px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.tip { position: absolute; left: 18px; right: 18px; bottom: 180px; background: #fff8e7e8; border-radius: 14px; padding: 8px 12px; font-size: 13px; text-align: center; border: 2px solid #c9a46a; }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 160px; background: #24382a; padding: 10px; }
.bar .lbl { color: #fff; text-align: center; font-weight: 700; font-size: 14px; margin-bottom: 8px; }
.slots { display: flex; gap: 8px; justify-content: center; }
.slot { width: 58px; height: 58px; border-radius: 12px; background: #fff8e7; border: 3px solid #8b5a2b; display: grid; place-items: center; font-size: 26px; position: relative; }
.slot.on { border-color: #f5c400; box-shadow: 0 0 0 3px #f5c400; }
.slot b { position: absolute; right: 4px; bottom: 1px; font-size: 12px; }
.acts { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
.btn { padding: 8px 14px; border-radius: 12px; background: #f0e0bd; font-weight: 700; font-size: 13px; }
</style></head><body>
<div class="bg"></div>
<div class="top"><div class="back">← Späť</div><div class="title">🌷 Záhon · 💧 poliaty</div></div>
<div class="tag">B · priblížené políčko</div>
<svg id="s" width="390" height="460" viewBox="0 0 390 460"></svg>
<div class="tip">👆 Ťukni na bod v záhone · potiahni dvoma prstami pre otočenie</div>
<div class="bar">
  <div class="lbl">Mak · rozostup 2</div>
  <div class="slots"><div class="slot on">🌱<b>4</b></div><div class="slot">🌺<b>2</b></div><div class="slot">💧</div><div class="slot">✂️</div><div class="slot">↔️</div></div>
</div>
<script>
const s = document.getElementById('s'), NS = 'http://www.w3.org/2000/svg';
const cx = 195, cy = 70, hw = 170, hh = 98;   // izometrický kosoštvorec políčka
const P = (u, v) => [cx + (u - v) * hw, cy + (u + v) * hh];   // u, v ∈ 0–1
const el = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); s.appendChild(e); return e; };
const poly = pts => pts.map(p => p.join(',')).join(' ');
// bočné steny záhonu (drevený rám)
const [A, B, C, D] = [P(0, 0), P(1, 0), P(1, 1), P(0, 1)], dz = 26;
el('polygon', { points: poly([D, C, [C[0], C[1] + dz], [D[0], D[1] + dz]]), fill: '#7a5230' });
el('polygon', { points: poly([B, C, [C[0], C[1] + dz], [B[0], B[1] + dz]]), fill: '#5e3e22' });
el('polygon', { points: poly([A, B, C, D]), fill: '#6b4a2b', stroke: '#8b5a2b', 'stroke-width': 6 });
const F = { '1,1': '🌻', '1,4': '🌷', '4,1': '🌼', '3,4': '🌸', '6,3': '🌷' };
const near = (x, y) => Object.keys(F).some(k => { const [a, b] = k.split(',').map(Number); return Math.max(Math.abs(a - x), Math.abs(b - y)) < 2; });
let sel = null;
for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
  const pts = [P(x / 8, y / 8), P((x + 1) / 8, y / 8), P((x + 1) / 8, (y + 1) / 8), P(x / 8, (y + 1) / 8)];
  const edge = x === 0 || y === 0 || x === 7 || y === 7, k = x + ',' + y;
  const fill = edge ? '#55391f' : F[k] ? '#8a6440' : near(x, y) ? '#6e4d2f' : '#9c7449';
  el('polygon', { points: poly(pts), fill, stroke: '#00000030', 'stroke-width': 1 });
  if (!edge && !F[k] && !near(x, y) && !sel) sel = pts;
}
if (sel) el('polygon', { points: poly(sel), fill: '#a978e0aa', stroke: '#fff', 'stroke-width': 3 });
// kvety zoradené odzadu dopredu
Object.keys(F).map(k => k.split(',').map(Number)).sort((a, b) => (a[0] + a[1]) - (b[0] + b[1])).forEach(([x, y]) => {
  const [px, py] = P((x + .5) / 8, (y + .5) / 8);
  el('ellipse', { cx: px, cy: py + 4, rx: 14, ry: 6, fill: '#0004' });
  const t = el('text', { x: px, y: py, 'font-size': 30, 'text-anchor': 'middle' }); t.textContent = F[x + ',' + y];
});
</script></body></html>
