<!doctype html><html><head><meta charset="utf-8"><style>
* { box-sizing: border-box; }
body { margin: 0; width: 390px; height: 780px; font-family: system-ui, "Segoe UI", Roboto, sans-serif; color: #2b2116; overflow: hidden; position: relative; }
.bg { position: absolute; inset: 0; background: url(game.png) 0 0 / 390px 780px; }
.dim { position: absolute; inset: 0; background: #0005; }
.card { position: absolute; left: 0; right: 0; bottom: 0; background: #fff8e7; border-radius: 22px 22px 0 0; border: 4px solid #8b5a2b; border-bottom: none; }
.head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 2px dashed #d9bf8c; }
.head h2 { margin: 0; font-size: 19px; }
.x { width: 34px; height: 34px; border-radius: 50%; background: #f0e0bd; display: grid; place-items: center; font-weight: 700; }
.info { display: flex; gap: 8px; padding: 8px 14px 0; font-size: 13px; color: #6b5a40; }
.chip { background: #f0e0bd; border-radius: 10px; padding: 3px 8px; }
.chip.ok { background: #cfe9ff; color: #1d4f7a; }
.grid { margin: 10px auto 6px; width: 296px; height: 296px; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); gap: 3px; padding: 6px; border-radius: 12px; background: #6b4a2b; box-shadow: inset 0 0 0 3px #503620; }
.c { border-radius: 6px; background: #8a6440; display: grid; place-items: center; font-size: 22px; position: relative; }
.c.edge { background: #5d4128; opacity: .55; }
.c.no { background: repeating-linear-gradient(45deg, #7a5636 0 4px, #6a4a2e 4px 8px); }
.c.free { background: #9c7449; box-shadow: inset 0 0 0 2px #e8c98f; }
.c.sel { box-shadow: 0 0 0 3px #a978e0, inset 0 0 0 2px #fff; background: #b58a58; }
.c.sel::after { content: '+'; color: #fff; font-weight: 800; font-size: 20px; }
.legend { display: flex; justify-content: center; gap: 12px; font-size: 11px; color: #6b5a40; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
.acts { display: flex; gap: 8px; padding: 10px 14px; }
.btn { flex: 1; padding: 11px 4px; border-radius: 14px; background: #f0e0bd; box-shadow: 0 3px 0 #c9a46a; font-weight: 700; font-size: 14px; text-align: center; }
.btn.main { background: linear-gradient(#a978e0, #6b3fa0); color: #fff; box-shadow: 0 3px 0 #4a2a72; }
.hand { display: flex; gap: 8px; padding: 0 14px 14px; align-items: center; font-size: 13px; color: #6b5a40; }
.slot { width: 46px; height: 46px; border-radius: 12px; background: #fff; border: 3px solid #8b5a2b; display: grid; place-items: center; font-size: 22px; position: relative; }
.slot.on { border-color: #f5c400; box-shadow: 0 0 0 2px #f5c400; }
.slot b { position: absolute; right: 3px; bottom: 0; font-size: 11px; }
.tag { position: absolute; top: 130px; left: 50%; transform: translateX(-50%); background: #fff8e7; border: 3px solid #8b5a2b; border-radius: 14px; padding: 6px 12px; font-weight: 700; font-size: 14px; }
</style></head><body>
<div class="bg"></div><div class="dim"></div>
<div class="tag">A · tlačidlo Detail</div>
<div class="card">
  <div class="head"><h2>🌷 Záhon · 5 kvetov</h2><div class="x">✕</div></div>
  <div class="info"><span class="chip ok">💧 poliaty</span><span class="chip">🌱 kompost</span><span class="chip">👤 Ivka</span><span class="chip">📜 1 pole</span></div>
  <div class="grid" id="g"></div>
  <div class="legend"><span><i style="background:#9c7449;box-shadow:inset 0 0 0 2px #e8c98f"></i>voľné</span><span><i style="background:repeating-linear-gradient(45deg,#7a5636 0 3px,#6a4a2e 3px 6px)"></i>príliš blízko</span><span><i style="background:#5d4128;opacity:.55"></i>okraj</span></div>
  <div class="acts"><div class="btn main">Zasadiť</div><div class="btn">💧 Poliať</div><div class="btn">✂️ Zrezať</div><div class="btn">↔️ Presunúť</div></div>
  <div class="hand">V ruke:<div class="slot on">🌱<b>4</b></div><div class="slot">🌺<b>2</b></div><div class="slot">🪣</div> Mak · rozostup 2</div>
</div>
<script>
const F = { '1,1': '🌻', '1,4': '🌷', '4,1': '🌼', '3,4': '🌸', '6,3': '🌷' };
const g = document.getElementById('g'); let selDone = '';
const near = (x, y) => Object.keys(F).some(k => { const [a, b] = k.split(',').map(Number); return Math.max(Math.abs(a - x), Math.abs(b - y)) < 2; });
for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
  const d = document.createElement('div'); d.className = 'c'; const k = x + ',' + y;
  if (F[k]) d.textContent = F[k];
  else if (x === 0 || y === 0 || x === 7 || y === 7) d.classList.add('edge');
  else if (near(x, y)) d.classList.add('no');
  else d.classList.add(selDone ? 'free' : (selDone = 'sel'));
  g.appendChild(d);
}
</script></body></html>
