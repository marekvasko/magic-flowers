# Jeden súbor pre všetky prostredia (produkcia, dev, PR náhľady) – líšia sa len premennými:
#   NAME   meno kontajnera a Traefik routera (produkcia: magicflowers)
#   DOMAIN verejná doména
#   IMAGE  obraz (CI: ghcr.io/...; ručne: lokálny build)
# Údaje sú v pomenovanom zväzku <projekt>_magicflowers-data, projekt určuje `docker compose -p`.
# Produkcia = projekt "magicflowers" → zväzok magicflowers_magicflowers-data (existujúce záhrady, NEMAZAŤ).
# Nasadzuje scripts/deploy.sh, ručne len v núdzi.
services:
  magicflowers:
    build: .
    image: ${IMAGE:-magicflowers:latest}
    container_name: ${NAME:-magicflowers}
    restart: unless-stopped
    environment:
      # štartovné mince a úroveň reputácie nového hráča – nastavuje ich deploy.sh len pre dev a PR náhľady
      START_COINS: ${START_COINS:-}
      START_REP: ${START_REP:-}
      # tajný kľúč ladiacej stránky /debug (GitHub secret DEBUG_TOKEN, môže byť iný pre každé prostredie); prázdny = /debug neexistuje
      DEBUG_TOKEN: ${DEBUG_TOKEN:-}
    volumes:
      - magicflowers-data:/app/data
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.${NAME:-magicflowers}.rule=Host(`${DOMAIN:?Nastav DOMAIN v .env}`)
      - traefik.http.routers.${NAME:-magicflowers}.entrypoints=websecure
      - traefik.http.routers.${NAME:-magicflowers}.tls.certresolver=tlschallenge
      - traefik.http.services.${NAME:-magicflowers}.loadbalancer.server.port=3000

volumes:
  magicflowers-data:

networks:
  web:
    external: true
