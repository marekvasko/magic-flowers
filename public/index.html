<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2f5d34">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Čarovná záhrada</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <!-- Prihlásenie -->
  <div id="join" class="screen">
    <div class="join-card">
      <h1>🌸 Čarovná záhrada</h1>
      <p class="sub">Pestuj kvety Slovenska, Česka a Európy.<br>Spolu s priateľmi. A možno stretneš víly…</p>
      <label>Tvoje meno<input id="jName" maxlength="14" placeholder="napr. Zuzka" autocomplete="off"></label>
      <label>Kód záhrady <small>(rovnaký kód = spoločná hra)</small><input id="jRoom" maxlength="16" placeholder="zahrada" autocomplete="off"></label>
      <div class="pick-row"><span>Tričko</span><div id="jShirt" class="swatches"></div></div>
      <div class="pick-row"><span>Vlasy</span><div id="jHair" class="swatches"></div></div>
      <canvas id="jPreview" width="96" height="96"></canvas>
      <button id="jGo" class="big">Vstúpiť do záhrady</button>
      <p class="hint">Najlepšie sa hrá na mobile na výšku. Pošli kamarátovi odkaz a rovnaký kód záhrady.</p>
    </div>
  </div>

  <!-- Hra -->
  <div id="game" class="screen hidden">
    <canvas id="cv"></canvas>
    <button id="rotL" class="rotbtn hidden" title="Otočiť pohľad">⟲</button>
    <button id="rotR" class="rotbtn hidden" title="Otočiť pohľad">⟳</button>
    <div id="joy" class="hidden"><div id="joyKnob"></div></div>
    <div id="moves"><button id="bCrawl" class="mvbtn" title="Plaziť sa (Shift)">🐛</button><button id="bJump" class="mvbtn" title="Skok (medzerník)">⤴</button></div>
    <div id="hud">
      <div class="hud-left">
        <div id="hDate"></div>
        <div id="hTime"><span id="hSky">☀️</span> <span id="hClock">06:00</span> <span id="hWeather"></span></div>
      </div>
      <div class="hud-right">
        <div id="hCoins">🪙 0</div>
        <button id="bBook" class="hbtn" title="Herbár">📖</button>
        <button id="bMenu" class="hbtn" title="Menu">☰</button>
      </div>
    </div>
    <div id="toasts"></div>
    <div id="chatlog"></div>
    <div id="bottom">
      <div id="selName"></div>
      <div id="hotbar"></div>
      <div id="emotes">
        <button data-e="wave">👋</button>
        <button data-e="heart">❤️</button>
        <button data-e="dance">💃</button>
        <button id="bChat">💬</button>
      </div>
    </div>
  </div>

  <!-- Modálne okno -->
  <div id="sleep" class="hidden"><div class="sl-card"><div class="sl-z">💤</div><div id="slTxt"></div><button id="slWake" class="btn">Vstať</button></div></div>
  <div id="modal" class="hidden">
    <div class="modal-card">
      <div class="modal-head"><h2 id="mTitle"></h2><button id="mClose">✕</button></div>
      <div id="mBody"></div>
    </div>
  </div>
  <div id="chatbox" class="hidden"><div id="chathist"></div><div class="chatrow"><input id="chatIn" maxlength="120" placeholder="Napíš správu…" autocomplete="off"><button id="chatSend">➤</button></div></div>
  <div id="conn" class="hidden">Pripájam sa…</div>
</div>
<script src="/shared/data.js"></script>
<script src="/shared/world3d.js"></script>
<script src="/art.js"></script>
<script src="/game.js"></script>
</body>
</html>
